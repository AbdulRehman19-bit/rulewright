[project]
name = "rulesmith"
version = "0.1.0.dev0"
description = "Mine repeated coding-agent mistakes from git history and propose evidence-backed rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "sentence-transformers>=3",
    "litellm>=1.50",
    "tenacity>=8",  # litellm needs it for num_retries but does not declare it
    "pyyaml>=6.0.3",
    "docker>=7",
]

[project.scripts]
rulesmith = "rulesmith.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rulesmith"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "sentence_transformers.*", "docker.*"]
ignore_missing_imports = true
